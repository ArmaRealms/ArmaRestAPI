import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.gradleup.shadow' version '9.6.1'
    id 'java'
}

group 'me.fredthedoggy'
version '1.0.5'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Disable the default 'jar' task to ensure only the shadowJar is produced
tasks.jar {
    enabled = false
}

shadowJar {
    relocate 'org.bstats', 'me.fredthedoggy.restpapi.libs.bstats'
    relocate 'org.eclipse.jetty', 'me.fredthedoggy.restpapi.libs.jetty'
    relocate 'com.google.gson', 'me.fredthedoggy.restpapi.libs.gson'
    archiveBaseName.set('Restpapi')
    archiveVersion.set('1.0.5')
    archiveClassifier.set('')

    // Explicitly include the main source set output for relocation
    from sourceSets.main.output
}

// Make sure 'build' depends on 'shadowJar'
build.dependsOn shadowJar

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    implementation('org.eclipse.jetty:jetty-server:12.1.13') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'me.clip:placeholderapi:2.12.3'
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('plugin.yml') {
        expand('project.version': project.version)
    }
    filesMatching('**/*') {
        exclude 'plugin.yml'
        filter ReplaceTokens, tokens: [version: version]
    }
}
