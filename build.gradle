import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2' // Reverted shadow plugin version
    id 'java'
}

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava.options.encoding 'UTF-8'

group 'me.fredthedoggy'
version '1.0.5'

java {
    withJavadocJar()
    withSourcesJar()
}

// Disable the default 'jar' task to ensure only the shadowJar is produced
tasks.jar {
    enabled = false
}

shadowJar {
    relocate 'org.bstats', 'me.fredthedoggy.restpapi.libs.bstats'
    relocate 'spark', 'me.fredthedoggy.restpapi.libs.spark'
    archiveBaseName.set('Restpapi')
    archiveVersion.set('1.0.5')
    archiveClassifier.set('')
    // Removed manifest block as it's not needed for Bukkit plugins

    // Explicitly include the main source set output for relocation
    from sourceSets.main.output

    // Minimize the JAR to remove unused classes and potentially fix relocation issues
    minimize()
}

// Make sure 'build' depends on 'shadowJar'
build.dependsOn shadowJar

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/groups/public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    implementation 'com.sparkjava:spark-core:2.9.4'
}

processResources {
    filesMatching('plugin.yml') {
        expand('project.version': project.version)
    }
    filesMatching('**/*') {
        exclude 'plugin.yml'
        filter ReplaceTokens, tokens: [version: version]
    }
}